name: Deploy TEMORA to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate solid-star PNG icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background black public/icons/star.svg -resize 192x192 public/icons/icon-192.png
          convert -background black public/icons/star.svg -resize 512x512 public/icons/icon-512.png
          convert -background black public/icons/star.svg -resize 512x512 public/icons/maskable-512.png
          convert -background black public/icons/star.svg -resize 180x180 public/icons/apple-touch-icon.png

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
